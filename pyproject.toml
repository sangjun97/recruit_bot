[project]
name = "radar"
version = "0.1.0"
description = "채용 레이더: 기업 공식 채용 홈페이지 신규 공고 알림 + 근무지 필터"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.50",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "anthropic>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]
