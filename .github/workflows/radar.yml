name: radar

on:
  schedule:
    # 30분마다 (UTC). 정각·30분은 GitHub 예약 실행이 가장 몰려 자주 밀리거나 빠지므로 7분·37분에 돌린다.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  # 수집 코드나 설정을 고쳐 푸시하면 다음 예약을 기다리지 않고 바로 한 번 돌린다.
  # 봇이 올리는 data/·docs/ 커밋은 경로가 달라 다시 실행을 부르지 않는다.
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "pyproject.toml"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run radar
        id: radar
        continue-on-error: true   # 일부 소스나 알림이 실패해도 나머지 결과와 사이트는 커밋한다. 아래 단계에서 실패로 표시
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m radar run

      - name: Commit data and site
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar.sqlite docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update postings $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 실행 중에 코드가 푸시됐으면 그 위로 옮겨서 다시 올린다
            git push || (git pull --rebase && git push)
          fi

      - name: Fail if radar failed
        if: steps.radar.outcome == 'failure'
        run: exit 1
